[project]
name = "kura"
version = "3.0.1"
description = "Kura (蔵) – personal video archiving tool built on yt-dlp and PyQt6"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yu ZHU" }]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-WebEngine>=6.7",
    "qtawesome>=1.3",
    "yt-dlp[default]>=2026.10.26",
    "deno>=2.5",
]

[project.urls]
Repository = "https://github.com/zhuyushuyo/kura"

[project.scripts]
kura-cli = "kura.core.cli:main"

[project.gui-scripts]
kura = "kura.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
